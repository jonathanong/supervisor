name: Docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Links point at other sites, which can break with no change here, so check once a day as well.
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links in Markdown resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Relative links between docs, heading anchors, and external URLs.
          args: >-
            --no-progress --include-fragments
            '*.md' 'docs/**/*.md'
          fail: true
