version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - hook-harness
        - pr-shepherd
    open-pull-requests-limit: 5
    groups:
      oxc:
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions-official:
        patterns:
          - 'actions/*'
