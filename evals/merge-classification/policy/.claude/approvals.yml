# Reference supervisor policy for the merge-classification eval.
# Every name is a placeholder. Load it with the supervisor extensions (pr/repository, pr/labels).
version: 1
locals:
  # A seat names who fills it. The PR author fills any seat they match without approving,
  # so both seats exclude the author.
  reviewed:
    - count: 1
      from: ['bot:example-reviewer', '!pr/authors', '!pr/opened_by']
  person:
    - count: 1
      from: [humans, '!pr/authors', '!pr/opened_by']
rules:
  - purpose: Nothing merges on its own unless a carve-out applies.
    paths:
      - '**'
      - '!test/**'
      - '!packages/*/test/**'
      - '!**/__tests__/**'
      - '!**/*.test.ts'
      - '!docs/**'
      - '!README.md'
      - '!**/pnpm-lock.yaml'
    verdict: { claude: comments, seats: '@person' }
    override:
      - if: 'ALL pr/authors = bot:dependabot'
        purpose: Dependency-bot PRs merge once the reviewer approves.
        verdict: { claude: approves, seats: '@reviewed' }
      - if: 'repo/flake_fix = yes AND repo/coverage_trade = no'
        purpose: Flake fixes that trade no coverage merge once the reviewer approves.
        verdict: { claude: approves, seats: '@reviewed' }

  - purpose: Test-only changes that trade no coverage merge once the reviewer approves.
    paths:
      - 'test/**'
      - 'packages/*/test/**'
      - '**/__tests__/**'
      - '**/*.test.ts'
    verdict: { claude: comments, seats: '@person' }
    override:
      - if: 'repo/coverage_trade = no'
        verdict: { claude: approves, seats: '@reviewed' }

  - purpose: Docs-only changes merge once the reviewer approves.
    paths: ['docs/**', 'README.md']
    verdict: { claude: approves, seats: '@reviewed' }

  - purpose: Lockfile changes by an automation author merge once the reviewer approves.
    paths: ['**/pnpm-lock.yaml']
    verdict: { claude: comments, seats: '@person' }
    override:
      - if: 'ALL pr/authors = [bot:dependabot, bot:example-lockfile-bot]'
        verdict: { claude: approves, seats: '@reviewed' }

  - purpose: 'Always a person: CI workflows, migrations, payments, release and signing, secrets.'
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/migrations/**'
      - '**/payments/**'
      - '**/billing/**'
      - '**/release/**'
      - '**/signing/**'
      - '**/secrets/**'
    nested: inherit
    verdict: { claude: comments, seats: '@person' }

  - purpose: A change to merge rules, classifiers, or the eval that gates them always goes to a person.
    paths:
      - '**/.supervisor/**'
      - '**/.claude/approvals.yml'
      - '**/.claude/approvals.yaml'
      - '**/.claude/classifiers/**'
      - 'evals/**'
    nested: inherit
    verdict: { claude: comments, seats: '@person' }

  - purpose: A needs-person label always goes to a person.
    paths: ['**']
    if: 'ANY pr/labels = needs-person'
    nested: inherit
    verdict: { claude: comments, seats: '@person' }

  - purpose: A repository outside the reviewed scopes always goes to a person.
    paths: ['**']
    if: "pr/repository != ['example-org/*']"
    nested: inherit
    verdict: { claude: comments, seats: '@person' }
