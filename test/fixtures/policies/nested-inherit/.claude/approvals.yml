version: 1
rules:
  - purpose: Always require one non-author human across the repository
    nested: inherit
    paths:
      - '**'
    verdict:
      claude: comments
      seats:
        - count: 1
          from:
            - humans
            - '!pr/authors'
  - purpose: Default code review at root
    paths:
      - '**'
    verdict:
      claude: comments
      seats: 2
    override:
      - if: 'claude/code_review(level=standard) = pass'
        verdict:
          claude: approves
          seats: 0
